<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <defs>
    <style>
      .title { font: 700 32px Arial, sans-serif; fill: #111827; }
      .stereotype { font: italic 18px Arial, sans-serif; fill: #374151; }
      .name { font: 700 24px Arial, sans-serif; fill: #111827; }
      .method { font: 17px 'Courier New', monospace; fill: #111827; }
      .label { font: 17px Arial, sans-serif; fill: #374151; }
      .box { stroke: #1f2937; stroke-width: 2; }
      .rule { stroke: #1f2937; stroke-width: 1.5; }
      .relation { stroke: #4b5563; stroke-width: 2.2; fill: none; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#4b5563"/>
    </marker>
    <marker id="diamond" markerWidth="16" markerHeight="12" refX="2" refY="6" orient="auto">
      <path d="M1,6 L7,1 L13,6 L7,11 Z" fill="white" stroke="#4b5563" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="1500" height="980" fill="#ffffff"/>
  <text x="750" y="42" text-anchor="middle" class="title">Online Order Processing Facade</text>

  <path d="M350 180 H455" class="relation" marker-end="url(#arrow)"/>
  <text x="401" y="166" text-anchor="middle" class="label">uses</text>

  <path d="M520 395 V485 H160 V545" class="relation" marker-start="url(#diamond)" marker-end="url(#arrow)"/>
  <path d="M625 395 V500 H455 V545" class="relation" marker-start="url(#diamond)" marker-end="url(#arrow)"/>
  <path d="M745 395 V545" class="relation" marker-start="url(#diamond)" marker-end="url(#arrow)"/>
  <path d="M865 395 V500 H1045 V545" class="relation" marker-start="url(#diamond)" marker-end="url(#arrow)"/>
  <path d="M970 395 V485 H1340 V545" class="relation" marker-start="url(#diamond)" marker-end="url(#arrow)"/>
  <text x="745" y="472" text-anchor="middle" class="label">coordinates in the correct order</text>

  <g transform="translate(40 105)">
    <rect width="310" height="150" fill="#f9fafb" class="box"/>
    <text x="155" y="30" text-anchor="middle" class="stereotype">«Client»</text>
    <text x="155" y="60" text-anchor="middle" class="name">DemoClient</text>
    <line x1="0" y1="76" x2="310" y2="76" class="rule"/>
    <text x="16" y="108" class="method">+ main(args): void</text>
    <text x="16" y="134" class="label">Uses only the Facade</text>
  </g>

  <g transform="translate(455 75)">
    <rect width="580" height="320" fill="#dbeafe" class="box"/>
    <text x="290" y="34" text-anchor="middle" class="stereotype">«Facade»</text>
    <text x="290" y="69" text-anchor="middle" class="name">OrderFacade</text>
    <line x1="0" y1="88" x2="580" y2="88" class="rule"/>
    <text x="18" y="126" class="method">- inventoryService: InventoryService</text>
    <text x="18" y="154" class="method">- paymentProcessor: PaymentProcessor</text>
    <text x="18" y="182" class="method">- shippingService: ShippingService</text>
    <text x="18" y="210" class="method">- notificationService: NotificationService</text>
    <text x="18" y="238" class="method">- orderRepository: OrderRepository</text>
    <line x1="0" y1="251" x2="580" y2="251" class="rule"/>
    <text x="18" y="278" class="method">+ placeOrder(cart, customer): OrderResult</text>
    <text x="18" y="306" class="method">+ cancelOrder(orderId): OrderResult</text>
  </g>

  <g transform="translate(25 545)">
    <rect width="270" height="330" fill="#ecfdf5" class="box"/>
    <text x="135" y="30" text-anchor="middle" class="stereotype">«Subsystem»</text>
    <text x="135" y="62" text-anchor="middle" class="name">InventoryService</text>
    <line x1="0" y1="78" x2="270" y2="78" class="rule"/>
    <text x="12" y="112" class="method">+ addStock(...)</text>
    <text x="12" y="144" class="method">+ reserve(...)</text>
    <text x="12" y="176" class="method">+ release(...)</text>
    <text x="12" y="208" class="method">+ availableQuantity(...)</text>
    <text x="12" y="258" class="label">Checks availability and</text>
    <text x="12" y="284" class="label">manages reservations.</text>
  </g>

  <g transform="translate(320 545)">
    <rect width="270" height="330" fill="#ecfdf5" class="box"/>
    <text x="135" y="30" text-anchor="middle" class="stereotype">«Subsystem»</text>
    <text x="135" y="62" text-anchor="middle" class="name">PaymentProcessor</text>
    <line x1="0" y1="78" x2="270" y2="78" class="rule"/>
    <text x="12" y="112" class="method">+ charge(...)</text>
    <text x="12" y="144" class="method">+ refund(...)</text>
    <text x="12" y="176" class="method">+ wasCharged(...)</text>
    <text x="12" y="208" class="method">+ wasRefunded(...)</text>
    <text x="12" y="258" class="label">Charges and refunds</text>
    <text x="12" y="284" class="label">payments.</text>
  </g>

  <g transform="translate(615 545)">
    <rect width="270" height="330" fill="#ecfdf5" class="box"/>
    <text x="135" y="30" text-anchor="middle" class="stereotype">«Subsystem»</text>
    <text x="135" y="62" text-anchor="middle" class="name">ShippingService</text>
    <line x1="0" y1="78" x2="270" y2="78" class="rule"/>
    <text x="12" y="112" class="method">+ scheduleDelivery(...)</text>
    <text x="12" y="144" class="method">+ cancelShipment(...)</text>
    <text x="12" y="176" class="method">+ isScheduled(...)</text>
    <text x="12" y="258" class="label">Creates and cancels</text>
    <text x="12" y="284" class="label">delivery records.</text>
  </g>

  <g transform="translate(910 545)">
    <rect width="270" height="330" fill="#ecfdf5" class="box"/>
    <text x="135" y="30" text-anchor="middle" class="stereotype">«Subsystem»</text>
    <text x="135" y="62" text-anchor="middle" class="name">NotificationService</text>
    <line x1="0" y1="78" x2="270" y2="78" class="rule"/>
    <text x="12" y="112" class="method">+ sendOrderConfirmed(...)</text>
    <text x="12" y="144" class="method">+ sendOrderCancelled(...)</text>
    <text x="12" y="176" class="method">+ sendOrderFailed(...)</text>
    <text x="12" y="258" class="label">Sends status messages</text>
    <text x="12" y="284" class="label">to the customer.</text>
  </g>

  <g transform="translate(1205 545)">
    <rect width="270" height="330" fill="#ecfdf5" class="box"/>
    <text x="135" y="30" text-anchor="middle" class="stereotype">«Subsystem»</text>
    <text x="135" y="62" text-anchor="middle" class="name">OrderRepository</text>
    <line x1="0" y1="78" x2="270" y2="78" class="rule"/>
    <text x="12" y="112" class="method">+ save(order)</text>
    <text x="12" y="144" class="method">+ findById(orderId)</text>
    <text x="12" y="176" class="method">+ updateStatus(...)</text>
    <text x="12" y="258" class="label">Stores order state</text>
    <text x="12" y="284" class="label">for later cancellation.</text>
  </g>

  <text x="750" y="935" text-anchor="middle" class="label">All arrows point from the Facade to independent subsystem classes. No subsystem has a back-reference.</text>
</svg>

